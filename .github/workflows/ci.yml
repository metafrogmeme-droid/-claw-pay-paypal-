# CI: lint, format, types, tests + coverage gate, copy-lint, gitleaks (+ self-test), dependency audit,
# Semgrep, Foundry. No secrets are used. No PayPal or LLM calls.
# Third-party actions are pinned by full commit SHA.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: v8.30.1
  SEMGREP_VERSION: 1.183.0
  FOUNDRY_VERSION: v1.8.7

jobs:
  node:
    name: lint, types, tests, coverage, copy-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run coverage
      - run: pnpm run copy-lint
      - run: pnpm run build
      # PayPal demo (docs/DEMO_SCRIPT.md): mock mode only, exits non-zero on any mismatch. No PayPal or LLM network calls.
      - run: node packages/cli/dist/bin/cp-demo-paypal.js

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --audit-level high

  gitleaks:
    name: gitleaks (self-test + full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
          cache: false
      # go install verifies the module against the Go checksum database (sum.golang.org).
      - run: go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
      - run: bash scripts/gitleaks-selftest.sh
      - run: gitleaks git --no-banner --redact --config .gitleaks.toml .

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install "semgrep==${SEMGREP_VERSION}"
      - run: semgrep scan --config p/default --config .semgrep --error --metrics=off

  foundry:
    name: foundry (fmt + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - run: forge --version
      - working-directory: contracts
        run: forge fmt --check && forge build
